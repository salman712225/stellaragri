name: Keep Render Service Awake

on:
  schedule:
    # Runs every 12 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Stellar Agri Render Endpoint
        run: |
          curl -s -f -m 30 "https://stellarone.site/health" || curl -s -f -m 30 "https://stellar-agri-ai.onrender.com/health" || echo "Service pinged"
