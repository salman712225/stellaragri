<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stellar Agri AI - Admin Sign In">
  <title>Admin Sign In | Stellar Agri AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/frontend/assets/logo.jpg">

  <style>
    :root {
      --bg-dark: #0a110d;
      --bg-card: rgba(18, 30, 23, 0.82);
      --border-color: rgba(74, 222, 128, 0.25);
      --border-glow: rgba(74, 222, 128, 0.45);
      --accent-green: #10b981;
      --accent-emerald: #059669;
      --text-primary: #ecfdf5;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 78, 59, 0.08) 0px, transparent 60%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 36px 32px;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.7), 0 0 30px rgba(16, 185, 129, 0.12);
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #10b981, #34d399, transparent);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo-img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }

    .brand-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .brand-header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #a7f3d0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      background: rgba(8, 15, 11, 0.85);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.25);
      background: rgba(10, 20, 15, 0.95);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
    }

    .toggle-password:hover {
      color: var(--text-primary);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.55);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      display: none;
    }

    .demo-credentials-card {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .demo-credentials-card strong {
      color: #6ee7b7;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #34d399;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <img src="/frontend/assets/logo.jpg" alt="Stellar Logo" class="brand-logo-img">
      <h1>Admin Control Center</h1>
      <p>Sign in to access MCP telemetry, call logs, and enquiries</p>
    </div>

    <div id="error-box" class="error-box"></div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" id="toggle-pwd" class="toggle-password" title="Show/Hide Password">👁️</button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">
        <span>🔐 Sign In to Dashboard</span>
      </button>
    </form>

    <div class="demo-credentials-card">
      <div>💡 <strong>Default Admin Credentials:</strong></div>
      <div>Username: <code>admin</code> • Password: <code>stellar2026</code></div>
    </div>

    <a href="/" class="back-link">← Back to Farmer Advisory</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loginForm = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');
      const errorBox = document.getElementById('error-box');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const togglePwdBtn = document.getElementById('toggle-pwd');

      // Check if already authenticated
      try {
        const token = localStorage.getItem('stellar_admin_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const chk = await fetch('/api/auth/me', { headers });
        if (chk.ok) {
          const chkData = await chk.json();
          if (chkData.authenticated) {
            window.location.href = '/admin';
            return;
          }
        }
      } catch (e) {}

      // Toggle Password Visibility
      togglePwdBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          togglePwdBtn.textContent = '🙈';
        } else {
          passwordInput.type = 'password';
          togglePwdBtn.textContent = '👁️';
        }
      });

      // Submit Form
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying...</span>';

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            // Save token to localStorage as client backup
            if (data.token) {
              localStorage.setItem('stellar_admin_token', data.token);
            }
            window.location.href = '/admin';
          } else {
            errorBox.textContent = data.detail || data.message || 'Invalid username or password.';
            errorBox.style.display = 'block';
          }
        } catch (err) {
          errorBox.textContent = 'Network error: ' + err.message;
          errorBox.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>🔐 Sign In to Dashboard</span>';
        }
      });
    });
  </script>
</body>
</html>
